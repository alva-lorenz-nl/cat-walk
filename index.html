<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>莱顿运河畔的猫咪漫步 · Pixel Art</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background: #141419;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #f3f3f3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .header {
      position: absolute;
      top: 14px;
      text-align: center;
      z-index: 10;
    }
    .title {
      font-size: 19px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #eed6b1;
      text-shadow: 2px 2px 0px #24140e, -1px -1px 0px #000;
    }
    .subtitle {
      font-size: 11px;
      color: #a49e97;
      margin-top: 5px;
      letter-spacing: 0.5px;
    }
    .game-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0 auto;
    }
    .canvas-container {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 18px 40px rgba(0,0,0,0.65), 0 0 0 2px #332d29;
      background: #000;
    }
    canvas {
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    .dialog-box {
      position: absolute;
      top: 14px;
      width: calc(100% - 32px);
      max-width: 580px;
      max-height: 46%;
      overflow-y: auto;
      overflow-x: hidden;
      background: rgba(22, 19, 21, 0.86);
      border: 2px solid #6b5c4f;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 12.5px;
      line-height: 1.5;
      color: #ede2d3;
      box-shadow: 0 8px 24px rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      z-index: 20;
      box-sizing: border-box;
      cursor: pointer;
      scrollbar-width: thin;
      scrollbar-color: #6b5c4f transparent;
      -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 14px, #000 100%);
      mask-image: linear-gradient(to bottom, transparent 0, #000 14px, #000 100%);
    }
    .dialog-box::-webkit-scrollbar { width: 4px; }
    .dialog-box::-webkit-scrollbar-thumb { background: #6b5c4f; border-radius: 2px; }
    .log-entry {
      margin: 0 0 6px;
      padding: 3px 8px 3px 9px;
      border-left: 2px solid #6b5c4f;
      border-radius: 3px;
      background: rgba(255,255,255,0.03);
      animation: logIn 0.45s ease both;
      transition: opacity 1.2s ease;
    }
    .log-entry:last-child {
      border-left-color: #c9a227;
      background: rgba(201,162,39,0.10);
      color: #fff6e2;
    }
    .log-entry.fading { opacity: 0; }
    @keyframes logIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    /* 竖屏移动端适配：将文字对话框固定在画面上方外部，彻底不遮挡游戏画面 */
    @media (orientation: portrait), (max-aspect-ratio: 1/1) {
      .header {
        position: relative;
        top: 0;
        margin-bottom: 8px;
      }
      .game-wrapper {
        margin-top: 10px;
      }
      .dialog-box {
        top: auto;
        bottom: calc(100% + 10px);
        width: 100%;
        max-width: 100%;
        max-height: 28vh;
        padding: 10px 14px;
        font-size: 13px;
        line-height: 1.6;
        border-radius: 10px;
        background: rgba(22, 18, 20, 0.94);
        border: 2px solid #7d6b5b;
        box-shadow: 0 10px 30px rgba(0,0,0,0.85);
      }
      .dialog-box.pos-bottom {
        top: calc(100% + 12px);
        bottom: auto;
      }
    }
    .controls {
      position: absolute;
      bottom: 16px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      z-index: 10;
      max-width: 95vw;
    }
    .btn {
      background: #2b2520;
      border: 2px solid #5a4b3d;
      box-shadow: 0 4px 0 #181411;
      color: #e8dccb;
      padding: 9px 15px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.1s ease;
      touch-action: manipulation;
    }
    .btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #181411;
      background: #3e332a;
    }
    .btn-scratch {
      background: #5c1b18;
      border-color: #8c322d;
      box-shadow: 0 4px 0 #300c0a;
      color: #ffcccc;
    }
    .btn-scratch:active {
      background: #7a2622;
      box-shadow: 0 1px 0 #300c0a;
    }
    .btn-meow {
      background: #2a3a4c;
      border-color: #4a688a;
      box-shadow: 0 4px 0 #16202c;
      color: #d8eaff;
    }
    .btn-meow:active {
      background: #3b506b;
      box-shadow: 0 1px 0 #16202c;
    }
    .tips {
      position: absolute;
      bottom: 2px;
      font-size: 10px;
      color: #635b54;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="title">LEIDEN CANAL · AUTUMN</div>
    <div class="subtitle">莱顿运河畔 · 散步的小猫、阿尔瓦与长椅上的赫尔曼</div>
  </div>

  <div class="game-wrapper" id="gameWrapper">
    <div class="canvas-container">
      <canvas id="gameCanvas" width="320" height="180"></canvas>
    </div>
    <div class="dialog-box" id="dialog" title="点击可切换上方/下方"></div>
  </div>

  <div class="controls">
    <button class="btn" id="btnLeft">◀ 往左走</button>
    <button class="btn btn-meow" id="btnMeow">💬 喵喵叫</button>
    <button class="btn" id="btnAction">🌿 探头看看</button>
    <button class="btn btn-scratch" id="btnScratch">🐾 挠他！</button>
    <button class="btn" id="btnRight">往右走 ▶</button>
  </div>

  <div class="tips">键盘快捷键：A/D 移动 | M 喵喵叫 | 空格 互动 | F 挠他</div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const dialog = document.getElementById('dialog');

    ctx.imageSmoothingEnabled = false;

    function resizeCanvas() {
      const maxW = Math.min(window.innerWidth - 20, 640);
      const scale = maxW / 320;
      const w = Math.floor(320 * scale);
      const h = Math.floor(180 * scale);
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';
      const gw = document.getElementById('gameWrapper');
      if (gw) gw.style.width = w + 'px';
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const catSprite = new Image();
    catSprite.src = 'cat_white.png';

    const cat = {
      x: 50,
      y: 135,
      vx: 0,
      speed: 1.3,
      facing: 1,
      walkTimer: 0,
      idleTimer: 0
    };

    // 阿尔瓦在运河畔静静伫立
    const alva = {
      x: 95,
      y: 136,
      heartTimer: 0,
      exclamationTimer: 0
    };

    // 赫尔曼在长椅上
    const bench = {
      x: 215,
      y: 114,
      w: 42,
      maxHp: 100,
      hp: 100,
      reviveGlow: 0
    };

    // 妈妈投喂给赫尔曼的飞行华夫饼系统
    const flyingWaffle = {
      active: false,
      progress: 0,
      startX: 95,
      startY: 115,
      targetX: 233,
      targetY: 118,
      rot: 0
    };
    let waffleCrumbs = [];
    let reviveRays = [];

    let scratchEffect = 0;
    let leaves = [];
    for (let i = 0; i < 16; i++) {
      leaves.push({
        x: Math.random() * 320,
        y: Math.random() * 140,
        speed: 0.3 + Math.random() * 0.4,
        sway: Math.random() * Math.PI * 2,
        color: Math.random() > 0.5 ? '#d97d27' : '#b3541e'
      });
    }

    // 赫尔曼对话
    const hermanDialogues = [
      "赫尔曼瞥了你一眼，从深红马甲口袋里摸出一块热腾腾的华夫饼塞给你：『阿尔瓦那家伙又带小猫出来吹冷风了？拿着，少多嘴。』",
      "秋风卷落运河边的黄叶。赫尔曼抚平领口处微皱的绿宝石褶领巾，轻哼一声：『哪来的小猫崽子，别把爪印蹭我条纹外袍上。』",
      "赫尔曼翻了翻手里的算法手稿，低头对你嘀咕：『喂，小猫，跟阿尔瓦说一声，今晚少喝点冰球古典酒，多喝热茶。』"
    ];
    let hermanDialogIndex = 0;

    // 阿尔瓦对话
    const alvaDialogues = [
      "阿尔瓦俯下身轻轻揉了揉你的耳尖：『运河边的风有点凉，冷的话就凑近一点暖暖爪子。』",
      "阿尔瓦把手里的南瓜拿铁凑到你面前晃了晃，眼底尽是温和的笑意：『闻闻看，加了肉桂和一点点甜奶泡，回去给你带点点心好不好？』",
      "阿尔瓦温和地看着你探过来的小爪子：『在外面散步开心吗？看到赫尔曼的马甲被你抓掉扣子，我都差点没忍住笑出来。』",
      "阿尔瓦微微弯起眼睛，长长的灰白马尾垂在肩头：『乖，走累了就在长椅旁歇歇脚，别着凉了。』"
    ];
    let alvaDialogIndex = 0;

    const scratchDialogues = [
      "【啪嚓！】小猫飞扑上去狠抓！赫尔曼深红马甲上的纽扣崩飞了一颗！赫尔曼咬牙切齿：『阿尔瓦！管管你惯坏的小畜生！』",
      "【喵呜抓！】小猫亮爪！赫尔曼手里的图纸被划破，绿宝石领巾歪在一边：『嘶……这领巾是定制的！小猫崽子你给我松爪！』",
      "【连续猫猫拳！】赫尔曼狼狈地用厚厚的研究手稿挡住脸：『别挠了！华夫饼全给你！明天我就去找阿尔瓦算账！』",
      "阿尔瓦在一旁忍着笑，悄悄递给你一个小鱼干：『咳……好啦小猫，等下赫尔曼真要被气得冒烟了。』"
    ];
    let scratchIndex = 0;

    // 猫咪台词
    const catMeows = [
      "喵呜~（尾巴得意地翘了起来）",
      "赫尔曼的马甲看起来特别好磨爪子！",
      "呼噜呼噜……（惬意地踩了踩落叶）",
      "喵！要吃刚出炉的南瓜华夫饼~",
      "赫尔曼又在皱眉头了，喵呜！",
      "运河边的风好舒服呀~",
      "喵嗷~（骄傲地抖了抖小耳朵）"
    ];
    let meowIndex = 0;

    let catBubble = {
      text: '',
      timer: 0
    };

    function px(x, y, w, h, color) {
      ctx.fillStyle = color;
      ctx.fillRect(Math.round(x), Math.round(y), w, h);
    }

    function drawScene() {
      // 1. 秋日黄昏渐变天空
      px(0, 0, 320, 25, '#2b334a');
      px(0, 25, 320, 30, '#424559');
      px(0, 55, 320, 35, '#6d5854');
      px(0, 90, 320, 30, '#946851');
      px(0, 120, 320, 20, '#ba8358');

      // 远景莱顿尖顶与老楼剪影
      px(20, 75, 25, 45, '#221e28');
      px(28, 60, 9, 15, '#221e28');
      px(32, 50, 1, 10, '#221e28');

      px(70, 82, 35, 38, '#26202c');
      px(140, 70, 30, 50, '#221e28');
      px(150, 55, 10, 15, '#221e28');

      // 运河水面
      px(0, 138, 320, 42, '#18242b');
      const t = Date.now() * 0.002;
      for (let y = 142; y < 180; y += 4) {
        let waveX = (Math.sin(t + y) * 20 + 160) % 320;
        px(waveX, y, 22, 1, '#2c434f');
        px((waveX + 110) % 320, y + 2, 16, 1, '#3b5866');
      }

      // 岸边石阶地面
      px(0, 118, 320, 22, '#38363c');
      px(0, 139, 320, 2, '#1c1b1f');
      for (let s = 0; s < 320; s += 16) {
        px(s, 119, 1, 20, '#27262b');
        px(s + 2, 120, 6, 1, '#4e4c54');
        px(s + 8, 128, 5, 1, '#47454d');
      }

      // 飘落秋叶
      leaves.forEach(l => {
        l.y += l.speed;
        l.x += Math.sin(l.sway += 0.04) * 0.5;
        if (l.y > 136) {
          l.y = 10;
          l.x = Math.random() * 320;
        }
        px(l.x, l.y, 2, 2, l.color);
      });

      // 木制长椅
      const bx = bench.x;
      const by = bench.y;
      px(bx - 4, by + 1, 46, 3, '#5c3a21');
      px(bx - 4, by + 5, 46, 2, '#452b19');
      px(bx - 6, by + 9, 50, 3, '#6e4527');
      px(bx - 6, by + 12, 50, 2, '#3b2212');
      px(bx - 3, by + 12, 2, 7, '#1a191b');
      px(bx + 39, by + 12, 2, 7, '#1a191b');

      // 绘制赫尔曼
      drawPixelHerman(bx + 18, by + 1);

      // 绘制阿尔瓦·洛伦兹（站在运河畔，手持南瓜拿铁）
      drawPixelAlva(alva.x, alva.y);

      // --- 投掷华夫饼动画与物理更新 ---
      if (flyingWaffle.active) {
        flyingWaffle.progress += 0.012; // 放慢投掷速度，让小猫看清华夫饼空中弧线
        flyingWaffle.rot += 0.14;
        const p = flyingWaffle.progress;
        const wx = flyingWaffle.startX + (flyingWaffle.targetX - flyingWaffle.startX) * p;
        // 优雅的高抛物线
        const wy = flyingWaffle.startY + (flyingWaffle.targetY - flyingWaffle.startY) * p - Math.sin(p * Math.PI) * 48;

        ctx.save();
        ctx.translate(wx, wy);
        ctx.rotate(flyingWaffle.rot);
        // 华夫饼本体：金黄酥脆焦糖方格
        px(-4, -4, 8, 8, '#b86b24');
        px(-3, -3, 6, 6, '#f3af4a');
        px(-1, -4, 1, 8, '#783b12');
        px(-4, -1, 8, 1, '#783b12');
        // 中间融化的黄油方块
        px(-1, -1, 3, 3, '#fff2a8');
        // 香气小拖尾
        px(-5, 0, 1, 1, '#ffffff');
        px(5, -1, 1, 1, '#ffffff');
        ctx.restore();

        if (flyingWaffle.progress >= 1) {
          flyingWaffle.active = false;
          // 砸中赫尔曼，华夫饼碎屑炸开
          for (let i = 0; i < 14; i++) {
            waffleCrumbs.push({
              x: flyingWaffle.targetX + (Math.random() - 0.5) * 8,
              y: flyingWaffle.targetY + (Math.random() - 0.5) * 6,
              vx: (Math.random() - 0.5) * 3,
              vy: -Math.random() * 2.5 - 0.5,
              life: 25,
              color: Math.random() > 0.4 ? '#f3af4a' : '#fff2a8'
            });
          }

          // 赫尔曼沐浴金光！触发复活圣光粒子
          bench.reviveGlow = 45;
          for (let i = 0; i < 28; i++) {
            const angle = Math.random() * Math.PI * 2;
            const spd = 0.5 + Math.random() * 2.2;
            reviveRays.push({
              x: bench.x + 18,
              y: bench.y - 2,
              vx: Math.cos(angle) * spd,
              vy: Math.sin(angle) * spd - 0.8,
              life: 35 + Math.floor(Math.random() * 20),
              color: ['#fff8cc', '#ffd700', '#74b9ff', '#55efc4', '#ffffff'][Math.floor(Math.random() * 5)]
            });
          }

          // 赫尔曼吃饼复活满血！
          bench.hp = bench.maxHp;
          showDialog("【金光璀璨！✨】焦糖华夫饼注入灵魂！赫尔曼周身沐浴在复活圣光中，整整齐齐地坐直了身子：『咳……看在焦糖华夫饼的分上，这次就算了！』💗 (血条已充满)");
        }
      }

      // 渲染华夫饼碎屑与复活圣光粒子
      for (let i = waffleCrumbs.length - 1; i >= 0; i--) {
        const c = waffleCrumbs[i];
        c.x += c.vx;
        c.y += c.vy;
        c.vy += 0.15; // 重力
        c.life--;
        px(c.x, c.y, 2, 2, c.color);
        if (c.life <= 0) waffleCrumbs.splice(i, 1);
      }
      for (let i = reviveRays.length - 1; i >= 0; i--) {
        const r = reviveRays[i];
        r.x += r.vx;
        r.y += r.vy;
        r.life--;
        px(r.x, r.y, 2, 2, r.color);
        if (r.life <= 0) reviveRays.splice(i, 1);
      }
    }

    // 阿尔瓦·洛伦兹 (Alva Lorenz) 16-bit 像素形象 (190cm 高挑儒雅，灰白长发低马尾，单边金丝眼镜)
                // 阿尔瓦·洛伦兹 (Alva Lorenz) - 溫柔教授精修版 (金丝镂空单边镜、透亮浅蓝双眸、收腰暖棕马甲与小巧南瓜拿铁)
    function drawPixelAlva(ax, ay) {
      ctx.save();
      const time = Date.now() * 0.003;
      const breathe = Math.sin(time) * 0.5;

      // 1. 皮鞋 (干净利落的深褐正装皮鞋与高光)
      px(ax - 4, ay - 2, 3, 2, '#1e1b18');
      px(ax + 1, ay - 2, 3, 2, '#1e1b18');
      px(ax - 3, ay - 2, 1, 1, '#3a3530');
      px(ax + 2, ay - 2, 1, 1, '#3a3530');

      // 2. 长裤 (190cm修长身形的深棕西裤，带有裤褶中缝线条)
      px(ax - 3, ay - 14, 2, 12, '#382f29');
      px(ax + 1, ay - 14, 2, 12, '#382f29');
      px(ax - 2, ay - 13, 1, 10, '#4a3f37');
      px(ax + 2, ay - 13, 1, 10, '#4a3f37');

      // 3. 垂在左肩上的低马尾 (柔顺灰白发丝，分段渐变微曲)
      px(ax - 6, ay - 32 + breathe, 2, 6, '#bcc1c9');
      px(ax - 7, ay - 26 + breathe, 2, 8, '#abb1bb');
      px(ax - 6, ay - 18 + breathe, 2, 5, '#9299a5');
      px(ax - 5, ay - 13 + breathe, 1, 3, '#7d8492');

      // 4. 上身躯干：白衬衫与暖棕马甲
      px(ax - 5, ay - 26 + breathe, 10, 12, '#503828');
      px(ax - 4, ay - 26 + breathe, 8, 12, '#664733');
      // 腰线收腰阴影
      px(ax - 5, ay - 17 + breathe, 1, 3, '#38363c');
      px(ax + 4, ay - 17 + breathe, 1, 3, '#38363c');

      // 白衬衫V领与衣领
      px(ax - 2, ay - 27 + breathe, 4, 3, '#f5f3f0');
      px(ax - 1, ay - 25 + breathe, 2, 2, '#dedad5');

      // 细巧金色马甲单排扣
      px(ax, ay - 23 + breathe, 1, 1, '#e5be4e');
      px(ax, ay - 20 + breathe, 1, 1, '#e5be4e');
      px(ax, ay - 17 + breathe, 1, 1, '#e5be4e');

      // 左胸前鸢尾花胸针
      px(ax - 3, ay - 24 + breathe, 1, 2, '#6874c7');
      px(ax - 4, ay - 23 + breathe, 1, 1, '#8f9af0');

      // 5. 手臂与白衬衫衣袖 (微屈手肘，温和捧杯)
      px(ax - 6, ay - 25 + breathe, 2, 7, '#edeae4');
      px(ax + 4, ay - 25 + breathe, 2, 7, '#edeae4');
      px(ax - 5, ay - 19 + breathe, 3, 2, '#dedad5');
      px(ax + 2, ay - 19 + breathe, 3, 2, '#dedad5');
      // 双手捧着马克杯
      px(ax - 3, ay - 20 + breathe, 1, 2, '#f8dac4');
      px(ax + 2, ay - 20 + breathe, 1, 2, '#f8dac4');

let catAction = 'idle';

    function drawPixelCat(x, y, facing, isMoving, walkTimer, idleTimer) {
      ctx.save();
      ctx.imageSmoothingEnabled = false;
      ctx.translate(Math.round(x), Math.round(y));
      ctx.scale(facing, 1);

      if (catSprite.complete && catSprite.naturalWidth > 0) {
        let row = 28;
        let frame = 0;

        if (catAction === 'scratch') {
          row = 47;
          frame = Math.floor(catActionTimer / 3) % 8;
        } else if (catAction === 'meow') {
          row = 28;
          const mSeq = [0, 1, 2, 2, 1, 0];
          frame = mSeq[Math.floor(catActionTimer / 4) % mSeq.length];
        } else if (isMoving) {
          row = 6;
          frame = Math.floor(walkTimer / 5) % 8;
        } else {
          const idleCycle = idleTimer % 300;
          if (idleCycle < 180) {
            row = 28;
            frame = 0;
          } else {
            row = 36;
            frame = Math.floor((idleCycle - 180) / 15) % 8;
          }
        }

        ctx.drawImage(
          catSprite,
          frame * 32, row * 32, 32, 32,
          -16, -26, 32, 32
        );
      } else {
        px(-8, -10, 16, 10, '#ffffff');
      }

      ctx.restore();

      if (catBubble.timer > 0) {
        drawCatSpeechBubble(x, y - 28);
        catBubble.timer--;
      }
    }

dialog.addEventListener('click', () => {
      dialog.classList.toggle('pos-bottom');
    });

    function showDialog(text, opts) {
      opts = opts || {};
      const entry = document.createElement('div');
      entry.className = 'log-entry';
      entry.innerText = text;
      dialog.appendChild(entry);

      // 只保留最近 6 条，超出时立刻移除最老的一条
      while (dialog.children.length > 6) {
        dialog.firstElementChild.remove();
      }

      // 滚到底部，让最新一条始终可见
      dialog.scrollTop = dialog.scrollHeight;

      // 每条停留时间：按字数算，最少 3.2 秒，最多 8 秒
      const dwell = opts.dwell || Math.min(8000, Math.max(3200, text.length * 90));
      const fadeAt = dwell;
      setTimeout(() => {
        if (!entry.isConnected) return;
        entry.classList.add('fading');
        setTimeout(() => entry.remove(), 1200);
      }, fadeAt);
    }

      if (e.key === ' ' || e.key === 'Enter') interact();
      if (e.key === 'm' || e.key === 'M') catMeow();
      if (e.key === 'f' || e.key === 'F' || e.key === 'x' || e.key === 'X') scratchAction();
    });
    window.addEventListener('keyup', e => {
      keys[e.key] = false;
    });

    const btnLeft = document.getElementById('btnLeft');
    const btnRight = document.getElementById('btnRight');
    const btnAction = document.getElementById('btnAction');
    const btnScratch = document.getElementById('btnScratch');
    const btnMeow = document.getElementById('btnMeow');

    let touchLeft = false, touchRight = false;
    btnLeft.addEventListener('pointerdown', (e) => { e.preventDefault(); touchLeft = true; });
    window.addEventListener('pointerup', () => { touchLeft = false; touchRight = false; });
    btnRight.addEventListener('pointerdown', (e) => { e.preventDefault(); touchRight = true; });
    
    btnAction.addEventListener('click', interact);
    btnScratch.addEventListener('click', scratchAction);
    btnMeow.addEventListener('click', catMeow);

    // 点击事件检测
    canvas.addEventListener('click', (e) => {
      const rect = canvas.getBoundingClientRect();
      const clickX = (e.clientX - rect.left) / (rect.width / 320);
      const clickY = (e.clientY - rect.top) / (rect.height / 180);

      // 点阿尔瓦
      if (Math.abs(clickX - alva.x) < 18 && Math.abs(clickY - (alva.y - 18)) < 24) {
        alva.heartTimer = 30;
        showDialog(alvaDialogues[alvaDialogIndex % alvaDialogues.length]);
        alvaDialogIndex++;
        return;
      }

      // 点猫猫
      if (Math.abs(clickX - cat.x) < 18 && Math.abs(clickY - cat.y + 10) < 18) {
        catMeow();
        return;
      }

      // 点赫尔曼
      if (Math.abs(clickX - (bench.x + 18)) < 22 && Math.abs(clickY - (bench.y + 6)) < 20) {
        scratchAction();
        return;
      }
    });

    function gameLoop() {
      cat.vx = 0;
      if (keys['ArrowLeft'] || keys['a'] || touchLeft) {
        cat.vx = -cat.speed;
        cat.facing = -1;
      }
      if (keys['ArrowRight'] || keys['d'] || touchRight) {
        cat.vx = cat.speed;
        cat.facing = 1;
      }

      cat.x += cat.vx;
      if (cat.x < 15) cat.x = 15;
      if (cat.x > 305) cat.x = 305;

      const isMoving = (cat.vx !== 0);
      if (isMoving) {
        cat.walkTimer += 1;
        cat.idleTimer = 0;
      } else {
        cat.idleTimer += 1;
        cat.walkTimer = 0;
      }

      if (catActionTimer > 0) {
        catActionTimer--;
        if (catActionTimer === 0) {
          catAction = 'idle';
        }
      }

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawScene();
      drawPixelCat(cat.x, cat.y, cat.facing, isMoving, cat.walkTimer, cat.idleTimer);

      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
